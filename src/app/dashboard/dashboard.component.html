<div class="dashboard-container">
  <div class="details-section">
    <div class="journey-image">AS</div>
    <div class="details">
      @for (detail of personalDetails; track detail) {
        <div class="detail">
          <label>{{ detail.title }}: </label>{{ detail.value }}
        </div>
      }
    </div>
  </div>
  <div class="cards-container">
    @for (detail of myDetails; track detail) {
      <app-card [detail]="detail" class="card"></app-card>
    }
  </div>
</div>
